name: Update OSM Land Gain

on:
  schedule:
    - cron: "0 12 21 3,6,9,12 *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore snapshots from GitHub Pages
        continue-on-error: true
        run: |
          mkdir -p web/public/data
          git fetch origin gh-pages:refs/remotes/origin/gh-pages --depth 1
          git archive origin/gh-pages data | tar -x -C web/public
          echo "Vorhandene Snapshots:"
          ls -1 web/public/data || true

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install Python dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Detect quarter snapshot day
        id: cal
        run: |
          python - <<'PY'
          from datetime import date
          import os

          from pipeline.snapshots import is_quarter_date

          today = date.today()
          quarter = "true" if is_quarter_date(today) else "false"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"quarter={quarter}\n")
              out.write(f"today={today.isoformat()}\n")
          print(f"Heute {today.isoformat()} Quartalstag={quarter}")
          PY

      - name: Install osmium-tool
        if: steps.cal.outputs.quarter == 'true'
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Run analysis pipeline
        if: steps.cal.outputs.quarter == 'true'
        env:
          OSM_USER: ${{ secrets.OSM_USER }}
          OSM_PASSWORD: ${{ secrets.OSM_PASSWORD }}
        run: |
          if [ -z "$OSM_USER" ] || [ -z "$OSM_PASSWORD" ]; then
            echo "Repository-Secrets OSM_USER und OSM_PASSWORD fehlen." >&2
            exit 1
          fi
          SNAPSHOT="${{ steps.cal.outputs.today }}"
          echo "Stichtag $SNAPSHOT (neuer Snapshot)"
          python -m pipeline.run --profile prod --download --snapshot "$SNAPSHOT" --out web/public/data

      - name: Upgrade restored snapshots
        if: steps.cal.outputs.quarter != 'true'
        run: |
          if ! ls web/public/data/*/cells.json >/dev/null 2>&1; then
            echo "Keine Snapshots nach Restore von gh-pages." >&2
            exit 1
          fi
          python -m pipeline.run --upgrade --out web/public/data

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web/dist
          force_orphan: true
